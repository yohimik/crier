# The card crier posts about its own releases.
#
# announce.sh drives this from dispat's announce stage; it is not a project
# anybody runs by hand, though `crier render --config announce/crier.yaml`
# with some DISPAT_* variables set is how the preview was made.
#
# Two passes per release share this file. This is the feed post as it stands;
# the story pass adds its own frame on the command line, so that what is
# written here is one thing rather than a set of values half of which every run
# has to undo.
render:
  # Two layouts rather than one. They share every load-bearing rule — the page
  # geometry, the margin boxes that carry the version badge and the page
  # counter, the wrapping of a changelog entry — and differ in how they look:
  # scanlines on near-black against a radial duotone with a framed card. crier
  # picks one per run from the run's seed, which announce.sh derives from the
  # version, so a release has a face of its own and every pass of that release
  # wears the same one.
  #
  # A pool and render.template together would not be an error, but the pool
  # would win and the file would read as two intentions, so there is no
  # render.template here.
  pool:
    - template.html
    - template-b.html
  # The data comes from announce.sh on standard input, built out of the
  # release-notes variables. It has arrays in it, which an env: prefix cannot
  # carry — this is the case stdin exists for.
  data: "-"
  width: 1080
  height: 1080
  format: jpeg
  # Instagram will not fetch a PNG, and the card is flat colour, so quality
  # costs little.
  jpeg-quality: 92
  # Only the fonts beside this file: a release must not render differently
  # because a runner has different fonts installed than a laptop.
  hermetic-fonts: true
  base-url: .
  # The card paginates: page one is the cover, and a long changelog carries on
  # across the pages after it. Ten is the default and it is stated here because
  # it is load-bearing for this card — a release past it fails the render
  # rather than posting a truncated version of itself, and notes.sh's own cap
  # of twenty entries a section is what keeps a real release well under it.
  pages-max: 10
  video:
    # The anthem, chosen the way the layout is: one of these per release, from
    # the same seed, so a re-run of a release plays the same sixteen seconds.
    # announce.sh turns video on with a flag for the one pass that renders the
    # clip; the pool sits here because it belongs to the project rather than to
    # that one invocation, and the pick is drawn on every run either way, which
    # is what keeps the passes agreeing with each other.
    #
    # announce/anthem.md carries the provenance of all four. They are
    # public-domain recordings, sixteen seconds each, normalised to the same
    # loudness so one release is not twice as loud as the last.
    audio-pool:
      - anthem.mp3
      - anthem-stars-and-stripes.mp3
      - anthem-william-tell.mp3
      - anthem-mountain-king.mp3

publish:
  # Instagram fetches the media from a public URL rather than taking bytes, so
  # a release running on a runner needs a tunnel. announce.sh sets stage.mode
  # and the tunnel; CRIER_STAGE_* overrides point it somewhere else. Every page
  # is staged, because Instagram fetches every one of them.
  caption: >-
    THIS IS RENDERED AND POSTED FROM GITHUB ACTIONS (DATA COMING FROM COMMIT MESSAGES) 
    crier v{{ .version }} is out.

    Render an HTML template to an image or a video and publish it to fourteen
    social platforms with one command.

    {{ range .install }}{{ if eq .label "curl" }}{{ .command }}{{ end }}{{ end }}
    
    github.com/yohimik/crier

    #golang #opensource #devtools #staticsite #automation

  instagram:
    enabled: true
    # The token the release carries is generated through "API setup with
    # Instagram business login", and a token of that flavour only parses on
    # this host — graph.facebook.com answers it with OAuthException 190
    # "Cannot parse access token" (which is exactly how the first announce
    # died). The Facebook-login flavour, a Page token, would use the
    # registry's graph.facebook.com default instead.
    api-base-url: https://graph.instagram.com/v25.0
    # No width, height or fit here: the feed post is the card as it was drawn.
    #
    # No max-attachments either. A feed post takes ten, which is the same as
    # render.pages-max, so a card that rendered at all is a card that fits in
    # one carousel.
    #
    # The story pass adds them —
    #
    #   --publish-instagram-story
    #   --publish-instagram-width 1080 --publish-instagram-height 1920
    #   --publish-instagram-fit contain
    #   --publish-instagram-fit-background "#04140c"
    #
    # contain rather than cover because the card is mostly text: cropping a
    # 1080 square to 9:16 would push 44% off each side and take the ends off
    # every line. The background is the card's own, so the letterbox reads as
    # part of the design instead of as bars.
    #
    # --publish-instagram-story also drops the carousel: stories have none, so
    # the pages become one story each, posted in order, each one live before
    # the next is created.

  linkedin:
    # Off in the file: announce.sh turns it on for its own pass with
    # --publish-linkedin-enabled=true, and turns Instagram off for that pass,
    # so each platform's post is its own step with its own failure. The token
    # and the author URN come from the environment
    # (CRIER_PUBLISH_LINKEDIN_TOKEN, CRIER_PUBLISH_LINKEDIN_AUTHOR_URN).
    #
    # LinkedIn takes the bytes directly, so this pass needs no tunnel and no
    # staging. A post takes one video or up to twenty images, never both, so
    # the anthem clip carries this commentary and the changelog pages follow
    # as a multi-image album with a short caption of their own, set on the
    # command line. With no ffmpeg to make the clip, the whole card goes out
    # as one album instead, cover first.
    enabled: false
    # A commentary of its own rather than the shared caption: the Instagram
    # caption is written for a feed of pictures, and this one is written for
    # the people who would actually run the thing. It leads with the part
    # worth stopping for: nobody wrote this post.
    caption: >-
      This post wrote itself. 🤖

      crier v{{ .version }} shipped a few minutes ago, and everything you see
      here was made by the release run itself: GitHub Actions read the
      changelog out of the conventional commits, rendered these cards from an
      HTML template with crier's own pure-Go engine (no browser anywhere in
      the pipeline), and published them before the run finished.

      No screenshots. No design tool. No human in the loop. The binary being
      announced is the binary doing the announcing.

      If your release notes deserve better than a wall of text, one command
      renders an HTML template into images or video and posts it across your
      social platforms: github.com/yohimik/crier

      {{ range .install }}{{ if eq .label "curl" }}{{ .command }}{{ end }}{{ end }}

      #buildinpublic #golang #opensource #devtools #automation #githubactions
      #cicd #devops #releasenotes #continuousdelivery #developertools
      #changelog #opensourcesoftware #shipit
