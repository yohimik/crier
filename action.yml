name: Setup crier
description: Install crier and put it on PATH.
author: yohimik

branding:
  icon: image
  color: purple

# A composite action is checked out with the repository it lives in, so the
# installer this runs is the one sitting beside it at whatever ref the caller
# pinned. Nothing is downloaded to bootstrap, and the action cannot drift from
# the script it wraps.
inputs:
  version:
    description: >-
      Version or tag to install: 1.2.3 or v1.2.3. Defaults to the latest
      stable release, which skips release candidates.
    required: false
    default: ''
  bin-dir:
    description: >-
      Where to install. Defaults to a directory under HOME, which needs no sudo
      and behaves the same on all three runner operating systems.
    required: false
    default: ''
  github-token:
    description: >-
      Token for the releases API. crier's releases are public, so this only
      raises the rate limit — but a shared CI egress address reaches the
      unauthenticated limit easily, and a private fork needs it to read its
      own releases at all.
    required: false
    default: ${{ github.token }}

outputs:
  version:
    description: The version that was installed.
    value: ${{ steps.unix.outputs.version || steps.windows.outputs.version }}
  path:
    description: The installed binary's full path.
    value: ${{ steps.unix.outputs.path || steps.windows.outputs.path }}

runs:
  using: composite
  steps:
    - id: unix
      if: runner.os != 'Windows'
      shell: bash
      # The scripts read all three of these from the environment, so there is
      # no argument list to build and no empty-version branch: an unset version
      # and an empty one already mean the same thing to install.sh.
      env:
        CRIER_VERSION: ${{ inputs.version }}
        CRIER_BIN_DIR: ${{ inputs.bin-dir }}
        GITHUB_TOKEN: ${{ inputs.github-token }}
      run: |
        set -eu
        BIN_DIR="${CRIER_BIN_DIR:-$HOME/.crier/bin}"
        export CRIER_BIN_DIR="$BIN_DIR"
        # install.sh prints the resolved version to stdout and everything else
        # to stderr, which is the whole of what this needs to report what it
        # did.
        VERSION=$(sh "$GITHUB_ACTION_PATH/install.sh")
        echo "version=$VERSION" >> "$GITHUB_OUTPUT"
        echo "path=$BIN_DIR/crier" >> "$GITHUB_OUTPUT"
        echo "$BIN_DIR" >> "$GITHUB_PATH"

    - id: windows
      if: runner.os == 'Windows'
      shell: pwsh
      env:
        CRIER_VERSION: ${{ inputs.version }}
        CRIER_BIN_DIR: ${{ inputs.bin-dir }}
        GITHUB_TOKEN: ${{ inputs.github-token }}
      run: |
        $ErrorActionPreference = 'Stop'
        $binDir = if ($env:CRIER_BIN_DIR) { $env:CRIER_BIN_DIR } else { Join-Path $env:USERPROFILE '.crier\bin' }
        $env:CRIER_BIN_DIR = $binDir
        $version = & "$env:GITHUB_ACTION_PATH/install.ps1"
        "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
        "path=$(Join-Path $binDir 'crier.exe')" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
        $binDir | Out-File -FilePath $env:GITHUB_PATH -Append
