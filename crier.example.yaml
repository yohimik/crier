render:
  # background colour transparent pixels are flattened onto for JPEG
  background: "#ffffff"
  # base URL, or a directory, that relative resources in the template resolve against
  base-url: ""
  # extra stylesheet files applied after the document's own CSS
  css: []
  # where the template's data comes from: a JSON or YAML file, "-" for stdin, or "env:PREFIX" to build it from the environment
  data: ""
  # extra directories scanned for fonts
  fonts-dir: []
  # output image format: png or jpeg
  format: "png"
  # output height in CSS pixels (0 lets the document's @page rule decide)
  height: 1920
  # ignore system fonts and use only the embedded Go fonts (deterministic output)
  hermetic-fonts: false
  # JPEG quality, 1 to 100
  jpeg-quality: 90
  # CSS media type used for the cascade: screen or print
  media-type: "screen"
  # output file path; empty writes into a temporary directory
  output: ""
  # template files parsed after the base one, redefining its {{block}} sections
  overlays: []
  # most pages a document may lay out into; content past it is refused (hard cap 20)
  pages-max: 10
  # a pool of base templates; one is chosen at random per run
  pool: []
  # device pixel ratio: output pixels per CSS pixel (max 4)
  scale: "1"
  # seed for the template randomisation; 0 draws a new one and logs it
  seed: 0
  # extra supersampling factor applied on top of scale, then downsampled
  supersample: 1
  # path to the Go html/template file to render
  template: ""
  video:
    # audio file mixed into the video
    audio: ""
    # output codec preset: h264, h265, vp9 or none to rely on ffmpeg-args alone
    codec-preset: "h264"
    # video length; ignored when render.video.frames is set
    duration: "3s"
    # render an animated template into a clip instead of a still image
    enabled: false
    # extra ffmpeg arguments, inserted before the output file
    ffmpeg-args: []
    # ffmpeg executable, resolved on PATH; ffmpeg is a prerequisite crier does not bundle
    ffmpeg-bin: "ffmpeg"
    # clip format: mp4 or gif
    format: "mp4"
    # video frame rate
    fps: 30
    # exact number of frames to render; 0 derives it from the duration and the frame rate
    frames: 0
    # directory or glob of existing frames to encode, instead of rendering them
    frames-input: ""
  # output width in CSS pixels (0 lets the document's @page rule decide)
  width: 1080
stage:
  # how to publish a public image URL: none, s3, server or url
  mode: "none"
  s3:
    # S3 access key id
    access-key: "<your-access-key>"
    # canned ACL applied to the object, e.g. "public-read"
    acl: ""
    # S3 bucket the image is uploaded to
    bucket: ""
    # delete the staged object once publishing is done
    delete-after: true
    # S3-compatible endpoint host, e.g. s3.amazonaws.com or localhost:9000
    endpoint: ""
    # key prefix inside the bucket
    prefix: ""
    # hand out a presigned URL instead of a public one
    presign: true
    # lifetime of the presigned URL
    presign-expiry: "1h"
    # base URL objects are publicly reachable at, when presign is false
    public-base-url: ""
    # S3 region
    region: "us-east-1"
    # S3 secret access key
    secret-key: "<your-secret-key>"
    # talk to the S3 endpoint over HTTPS
    use-ssl: true
  server:
    # address the built-in stage server listens on
    listen: "127.0.0.1:0"
    # base URL the stage server is reachable at from the internet
    public-url: ""
    # how long to wait for the stage server to shut down
    shutdown-timeout: "10s"
    tunnel:
      # ngrok local agent API polled for the public URL
      api-url: "http://127.0.0.1:4040/api/tunnels"
      # extra tunnel arguments; {port} and {addr} are substituted
      args: []
      # tunnel executable; defaults to the mode's own name, resolved on PATH
      bin: ""
      # expose the stage server publicly: none, ngrok, zrok or custom
      mode: "none"
      # how long to wait for the tunnel to report a public URL
      startup-timeout: "30s"
      # regexp with one capture group finding the public URL in the tunnel output (custom mode)
      url-pattern: ""
  # pre-hosted image URL used when stage.mode is url
  url: ""
