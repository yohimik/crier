<!doctype html>
<html>
<head>
<style>
  @font-face { font-family: "Varela Round"; src: url("../fonts/varela-round/VarelaRound-Regular.ttf") }

  html, body { height: 100%; margin: 0 }
  body { font-family: "Varela Round", sans-serif }
  .card {
    width: 100%; height: 100%; box-sizing: border-box;
    /* Vibrant duotone: two strong colours meeting on a diagonal. */
    background: linear-gradient(200deg, #ff5f6d 0%, #ff8a5b 38%, #7b4cff 100%);
    color: #fffdfa;
    padding: 150px 96px;
    text-align: center;
  }
  .kicker { font-size: 34px; letter-spacing: 10px; opacity: .82 }
  h1 { font-size: 122px; line-height: 1.06; margin: 40px 0 0 0 }
  .rule { width: 160px; height: 8px; background: #fffdfa; border-radius: 4px; margin: 56px auto }
  .when { font-size: 56px; line-height: 1.5 }
  .where { margin-top: 18px; font-size: 40px; opacity: .88 }
  .chip {
    margin-top: 96px; display: inline-block;
    border: 5px solid #fffdfa; border-radius: 999px;
    font-size: 38px; padding: 26px 56px;
  }
  .note { margin-top: 64px; font-size: 30px; opacity: .78 }
</style>
</head>
<body>
  <div class="card">
    <div class="kicker">{{ upper .kicker }}</div>
    {{ block "headline" . }}<h1>{{ .title }}</h1>{{ end }}
    <div class="rule"></div>
    <div class="when">{{ .when }}</div>
    <div class="where">{{ .where }}</div>
    <div class="chip">{{ .cta }}</div>
    <div class="note">{{ .note }}</div>
  </div>
</body>
</html>
