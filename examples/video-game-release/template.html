<!doctype html>
<html>
<head>
<style>
  @font-face { font-family: "Press Start 2P"; src: url("../fonts/press-start-2p/PressStart2P-Regular.ttf") }
  @font-face { font-family: "Space Mono"; font-weight: 400; src: url("../fonts/space-mono/SpaceMono-Regular.ttf") }

  /* A page-filling card: html and body have to carry the height for a
     percentage height on the card to mean anything. */
  html, body { height: 100%; margin: 0 }
  body { font-family: "Space Mono", monospace }

  .card {
    width: 100%; height: 100%; box-sizing: border-box;
    /* Neon dark: a repeating gradient laid over a flat base, which is the
       raster backend's repeating-gradient path. */
    background:
      repeating-linear-gradient(115deg,
        rgba(255,0,128,.16) 0px, rgba(255,0,128,.16) 3px,
        rgba(0,0,0,0) 3px, rgba(0,0,0,0) 22px),
      linear-gradient(180deg, #12002b 0%, #2a0140 60%, #07000f 100%);
    color: #f2e9ff;
    padding: 72px 80px;
  }
  .badge {
    display: inline-block; font-family: "Press Start 2P", monospace;
    font-size: 20px; color: #08000f; background: #39ff88;
    padding: 14px 20px; letter-spacing: 2px;
  }
  h1 {
    font-family: "Press Start 2P", monospace;
    font-size: 62px; line-height: 1.35;
    margin: 40px 0 0 0; color: #ff2fb0;
  }
  .version { margin-top: 20px; font-size: 30px; color: #39ff88; letter-spacing: 4px }
  ul { margin: 44px 0 0 0; padding: 0; list-style: none }
  li { font-size: 27px; line-height: 1.85; color: #cfc0e8 }
  li::before { content: "> "; color: #39ff88 }
  .footer { margin-top: 48px; font-size: 22px; color: #7a6a94; letter-spacing: 3px }
</style>
</head>
<body>
  <div class="card">
    {{ block "badge" . }}<div class="badge">{{ .badge }}</div>{{ end }}
    {{ block "headline" . }}<h1>{{ .title }}</h1>{{ end }}
    <div class="version">{{ .version }}</div>
    {{ block "notes" . }}
    <ul>{{ range .notes }}<li>{{ . }}</li>{{ end }}</ul>
    {{ end }}
    <div class="footer">{{ .footer }}</div>
  </div>
</body>
</html>
