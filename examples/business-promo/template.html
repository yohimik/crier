<!doctype html>
<html>
<head>
<style>
  /* The fonts travel with the example, so this card renders identically on
     any machine. render.hermetic-fonts keeps the system's fonts out. */
  @font-face { font-family: "Poppins"; font-weight: 400; src: url("../fonts/poppins/Poppins-Regular.ttf") }
  @font-face { font-family: "Poppins"; font-weight: 700; src: url("../fonts/poppins/Poppins-Bold.ttf") }

  html, body { height: 100%; margin: 0 }
  body { font-family: "Poppins", sans-serif }

  .card {
    width: 100%; height: 100%; box-sizing: border-box;
    /* Corporate blue, as a single linear gradient. */
    background: linear-gradient(135deg, #0b3d91 0%, #1565c0 55%, #2196f3 100%);
    color: #ffffff;
    padding: 96px 88px;
  }
  .eyebrow { font-size: 34px; letter-spacing: 8px; text-transform: uppercase; opacity: .72 }
  h1 { font-size: 118px; font-weight: 700; line-height: 1.02; margin: 28px 0 0 0 }

  /* Long product blurbs are the normal case, not the exception. This is the
     line-clamp recipe from docs/templates.md: two lines, then an ellipsis. */
  .blurb {
    margin-top: 36px; font-size: 40px; line-height: 1.45; opacity: .9;
    overflow: hidden; overflow-wrap: break-word;
    max-lines: 3; continue: discard; block-ellipsis: auto;
  }

  .price { margin-top: 64px; font-size: 150px; font-weight: 700; line-height: 1 }
  .was { font-size: 52px; font-weight: 400; opacity: .6; text-decoration: line-through; margin-left: 24px }
  .cta {
    margin-top: 72px; display: inline-block;
    background: #ffffff; color: #0b3d91;
    font-size: 40px; font-weight: 700; padding: 26px 52px; border-radius: 12px;
  }
</style>
</head>
<body>
  <div class="card">
    <div class="eyebrow">{{ .eyebrow }}</div>
    {{ block "headline" . }}<h1>{{ .headline }}</h1>{{ end }}
    <div class="blurb">{{ .blurb }}</div>
    <div class="price">{{ .price }}<span class="was">{{ .was }}</span></div>
    <div class="cta">{{ .cta }}</div>
  </div>
</body>
</html>
