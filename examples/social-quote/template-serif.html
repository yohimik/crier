<!doctype html>
<html>
<head>
<style>
  @font-face { font-family: "PT Serif"; font-weight: 400; src: url("../fonts/pt-serif/PTSerif-Regular.ttf") }
  @font-face { font-family: "PT Serif"; font-weight: 700; src: url("../fonts/pt-serif/PTSerif-Bold.ttf") }
  @font-face { font-family: "PT Serif"; font-style: italic; src: url("../fonts/pt-serif/PTSerif-Italic.ttf") }

  /* The accent is drawn from the run's seeded random source, so every run
     produces a different card and --render-seed reproduces any of them.
     See docs/templates.md, "Template pools and randomisation". */
  {{ $accent := randChoice .accents }}

  html, body { height: 100%; margin: 0 }
  body { font-family: "PT Serif", serif }
  .card {
    width: 100%; height: 100%; box-sizing: border-box;
    /* Warm pastel, as a radial gradient. */
    background: radial-gradient(circle at 22% 18%, #fff6ec 0%, #f7e2cf 45%, #efd0b6 100%);
    color: #3b2a20;
    padding: 92px 104px;
    border-left: 18px solid {{ $accent }};
  }
  .mark { font-size: 130px; line-height: .6; color: {{ $accent }}; opacity: .55 }
  blockquote {
    margin: 8px 0 0 0; font-size: 52px; line-height: 1.34; font-style: italic;
    /* Long quotes are clamped rather than allowed to escape the card. */
    overflow: hidden; overflow-wrap: break-word;
    max-lines: 4; continue: discard; block-ellipsis: auto;
  }
  .who { margin-top: 44px; font-size: 30px; font-weight: 700; letter-spacing: 2px }
  .who span { color: {{ $accent }} }
</style>
</head>
<body>
  <div class="card">
    <div class="mark">&ldquo;</div>
    <blockquote>{{ .quote }}</blockquote>
    <div class="who">{{ .author }} <span>&middot;</span> {{ .source }}</div>
  </div>
</body>
</html>
