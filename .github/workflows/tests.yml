# The repository's gates: format, vet, lint, the generated documentation, both
# test suites with their coverage floor, and the cross-compile.
#
# Every gate is a build of the root Dockerfile, invoked through dispat, so a job
# needs Docker, git and dispat and no Go toolchain of its own — and the commands
# mean the same thing on a laptop and on a runner.
#
# Ubuntu only, on purpose: Docker is Linux, and the cross-platform question is
# answered where it can actually be answered — the build target validates every
# binary and runs the Linux ones, and the release workflow's post-release matrix
# installs the published binary on all three operating systems and runs it.
name: tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    name: Format, vet and lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # dispat reads tags and commit ranges; a shallow clone has neither.
          fetch-depth: 0
      - uses: docker/setup-buildx-action@v3
      - name: Set up dispat
        uses: yohimik/dispat@v1
      - run: dispat run gofmt --since all
      - run: dispat run vet --since all
      - run: dispat run lint --since all
      - name: Documentation is in step with the configuration
        run: dispat run docs --since all

  test:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: docker/setup-buildx-action@v3
      - name: Set up dispat
        uses: yohimik/dispat@v1
      # The unit suite, the black-box suite, the real-ffmpeg smoke and the
      # coverage floor: one target, because they are one verdict.
      - run: dispat run tests --since HEAD~1

  build:
    name: Cross-compile
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: docker/setup-buildx-action@v3
      - name: Set up dispat
        uses: yohimik/dispat@v1
      # Every target the release builds, each binary read back to prove it is
      # what its name claims, and the Linux ones executed.
      - run: dispat run cross-compile --since HEAD~1
