# Replay an announcement for a version that already shipped. The release
# workflow announces on release day; this one exists for the day a platform
# refused a post for reasons of its own — the tag exists, the release cannot
# run again, and one post still has to be said.
name: announce

on:
  workflow_dispatch:
    inputs:
      script:
        description: replay script under announce/ to run
        required: true
        default: replay-v1.0.0-linkedin.sh

permissions:
  contents: read

jobs:
  replay:
    name: Replay
    runs-on: ubuntu-latest
    env:
      CRIER_PUBLISH_LINKEDIN_TOKEN: ${{ secrets.CRIER_PUBLISH_LINKEDIN_TOKEN }}
      CRIER_PUBLISH_LINKEDIN_AUTHOR_URN: ${{ secrets.LINKEDIN_URN }}
      SCRIPT: ${{ inputs.script }}
    steps:
      - uses: actions/checkout@v4
      - name: Set up dispat
        uses: yohimik/dispat@v1
      # The bytes that announce are the bytes that shipped: the replay uses
      # the released binary rather than rebuilding the tree.
      - name: Install the released crier
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: dispat install yohimik/crier --bin-dir ./replay-bin
      - name: Install ffmpeg
        # update first: the image's package lists go stale and a mirror 404
        # is what a missing update looks like.
        run: sudo apt-get update -qq >/dev/null && sudo apt-get install -y -qq ffmpeg >/dev/null && ffmpeg -version | head -1
      - name: Replay
        run: |
          case "$SCRIPT" in
            *[!A-Za-z0-9._-]*|'') echo "script names are a single file name" >&2; exit 2 ;;
          esac
          ANNOUNCE_CRIER_BIN="$PWD/replay-bin/crier" sh "announce/$SCRIPT"
