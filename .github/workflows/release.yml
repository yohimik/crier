# Cut a release: work out the version from the conventional commits, write the
# changelog, tag, and attach the cross-compiled binaries to a GitHub release.
#
# Manual rather than tag-triggered: the tag does not exist until dispat creates
# it, and a tag pushed with GITHUB_TOKEN does not re-trigger a workflow anyway.
name: release

on:
  workflow_dispatch:

# One release at a time, and never cancelled halfway: a run interrupted between
# the tag and the GitHub release leaves a tag with nothing attached to it.
concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  plan:
    name: Plan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up dispat
        uses: yohimik/dispat@v1
      # --require-release exits 3 when the commits since the last tag hold
      # nothing releasable, which is a normal outcome rather than a failure —
      # but it still stops the run, because there is nothing to do.
      - name: What would be released
        run: |
          set +e
          dispat status --require-release
          case $? in
            0) echo "there is a release to cut" ;;
            3) echo "nothing to release since the last tag"; exit 1 ;;
            *) echo "dispat status failed"; exit 1 ;;
          esac

  tests:
    name: Tests
    needs: plan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up dispat
        uses: yohimik/dispat@v1
      - run: dispat run vet --since all
      # The tests target carries the unit suite, the black-box e2e suite and
      # the coverage floor in one build; there is no separate e2e script.
      - run: dispat run tests --since all
      - run: dispat run cross-compile --since all

  release:
    name: Release
    needs: tests
    runs-on: ubuntu-latest
    outputs:
      released: ${{ steps.dispat.outputs.released }}
      version: ${{ steps.dispat.outputs.version }}
    permissions:
      # Writing the changelog commit, the tag, and the release itself — and the
      # remote lock tag dispat takes while it does.
      contents: write
    # The announcement's secrets live on the job rather than on the step that
    # uses them, because a step's `if` is evaluated before its own `env` — and
    # the ngrok install has to be able to ask whether there is a token before
    # spending a minute on apt.
    #
    # Every one is optional. announce.sh says what is missing and exits 0: a
    # release must not go red for want of a social media token.
    env:
      CRIER_PUBLISH_INSTAGRAM_TOKEN: ${{ secrets.CRIER_PUBLISH_INSTAGRAM_TOKEN }}
      CRIER_PUBLISH_INSTAGRAM_USER_ID: ${{ secrets.CRIER_PUBLISH_INSTAGRAM_USER_ID }}
      NGROK_AUTHTOKEN: ${{ secrets.NGROK_AUTHTOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up dispat
        uses: yohimik/dispat@v1
      # The whole release is one command: version, changelog, commit, tag,
      # build, GitHub release. JSON logging because a released run is one a
      # machine may want to read back. The outputs come from the package's
      # announce script.
      # crier announces its own releases on Instagram, from dispat's announce
      # stage. Instagram fetches the media from a public URL of its own accord
      # and a runner has none, so the stage server needs a tunnel — installed
      # only when there is a token to run it with, since the whole announcement
      # is skipped without one.
      - name: Install ngrok
        if: env.NGROK_AUTHTOKEN != ''
        run: |
          set -eu
          sudo install -m 0755 -d /etc/apt/keyrings
          curl -fsSL https://ngrok-agent.s3.amazonaws.com/ngrok.asc |
            sudo gpg --dearmor -o /etc/apt/keyrings/ngrok.gpg
          echo "deb [signed-by=/etc/apt/keyrings/ngrok.gpg] https://ngrok-agent.s3.amazonaws.com buster main" |
            sudo tee /etc/apt/sources.list.d/ngrok.list >/dev/null
          sudo apt-get update -qq
          sudo apt-get install -y -qq ngrok
          ngrok version

      - name: Release
        id: dispat
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: dispat --log-format json

  install:
    name: Install the released binary
    needs: release
    if: needs.release.outputs.released == 'true'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      # The release is only finished when the assets it published actually
      # install and run, which is a thing only a fresh machine can answer.
      # The version is pinned to what this run released: the default
      # resolution takes the highest stable, which an rc is not.
      - uses: actions/checkout@v4
      - name: Set up dispat
        uses: yohimik/dispat@v1
      # Bare, no --asset: the binaries carry the conventional name a bare
      # `dispat install` looks for (dispat 1.7), and this step is where that
      # spelling — the one the README teaches — is proven. `--as
      # crier-via-dispat` keeps this install apart from the script installs
      # below, so each route is proven on its own.
      - name: Install crier with dispat
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: dispat install yohimik/crier --release "${{ needs.release.outputs.version }}" --as crier-via-dispat --bin-dir ./dispat-bin
      - name: The dispat install runs
        shell: bash
        run: |
          exe=./dispat-bin/crier-via-dispat
          [ "$RUNNER_OS" = "Windows" ] && exe="$exe.exe"
          "$exe" --version
      # And the platform's own install script — the other half of this
      # repository's install story.
      - name: Install crier with install.ps1
        if: runner.os == 'Windows'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: pwsh
        run: |
          $v = ./install.ps1 -Version '${{ needs.release.outputs.version }}' -BinDir "$env:USERPROFILE\.crier\bin"
          "version=$v" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          "$env:USERPROFILE\.crier\bin" | Out-File -FilePath $env:GITHUB_PATH -Append
      # And the Unix half of the script story, beside the dispat route.
      - name: Install crier with install.sh
        if: runner.os != 'Windows'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CRIER_VERSION: ${{ needs.release.outputs.version }}
          CRIER_BIN_DIR: /tmp/crier-script-install
        run: |
          sh ./install.sh
          /tmp/crier-script-install/crier --version
      # And the fourth route: the composite action, from the tag this run
      # published rather than from the workspace. A caller writing
      # `uses: yohimik/crier@v1.2.3` gets the action.yml and the installer that
      # shipped in that tag, so that is what this proves — a checkout of the
      # release itself, used as an action.
      - name: Check out the released tag
        uses: actions/checkout@v4
        with:
          ref: v${{ needs.release.outputs.version }}
          path: released
      - name: Install crier with the composite action
        id: action
        uses: ./released
        with:
          # Pinned for the same reason as the routes above: the default
          # resolution takes the highest stable, which a release candidate is
          # not.
          version: ${{ needs.release.outputs.version }}
          bin-dir: ${{ runner.temp }}/crier-action-install
      # From the action's own path output rather than from PATH: the output is
      # half its contract, and a workflow that reads it has to get a path that
      # runs.
      - name: The action's install runs
        if: runner.os != 'Windows'
        shell: bash
        run: |
          "${{ steps.action.outputs.path }}" --version
          [ "${{ steps.action.outputs.version }}" = "${{ needs.release.outputs.version }}" ] ||
            { echo "the action reported ${{ steps.action.outputs.version }}" >&2; exit 1; }
      - name: The action's install runs
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          & '${{ steps.action.outputs.path }}' --version
          if ('${{ steps.action.outputs.version }}' -ne '${{ needs.release.outputs.version }}') {
            throw "the action reported ${{ steps.action.outputs.version }}"
          }
