# crier's release configuration.
#
# One package, one Go module, one binary. dispat reads the conventional commits
# since the last tag, works out the version, writes the changelog, tags, and
# attaches the cross-compiled binaries to a GitHub release.
#
#   dispat status          # what would be released, and why
#   dispat                 # release it (CI does this; see .github/workflows)
#
# Every gate is a build of the Dockerfile, so a job needs Docker, git and
# dispat and no Go toolchain of its own — and `dispat run tests` means the same
# thing on a laptop and on a runner. The bare `go test ./...` path still works
# for local development; see docs/operations/development.md.

# v1.2.3 for a stable release and v1.0.0-rc.0 for a release candidate: the
# prerelease lives inside {version}, so one format spells both. Both are valid
# Go module versions, which is what makes `go install …/cmd/crier@v1.0.0-rc.0`
# work — and `@latest` skip it, because Go's own rule ignores prereleases.
#
tagFormat: v{version}

# `uses: yohimik/crier@v1` — the Marketplace only accepts that ref shape, so the
# composite action needs a moving major tag beside the exact one.
#
# `channels: [stable]` is the whole point of the scoping: a release candidate
# must never drag v1 forward. Someone pinned to @v1 asked for the stable line,
# and 1.0.0-rc.0 answering that would hand them a prerelease they did not ask
# for. The tag therefore does not exist at all until the first stable release,
# which is worth saying in the README rather than leaving people to discover.
aliasTags:
  - format: v{major}
    moving: true
    channels: [stable]

parser:
  # The channels this repository releases on. dispat needs no declaration to
  # use a channel — it reads one out of the baseline tag — so this exists to
  # refuse the ones nobody meant: a commit marked `%re` or `%RC` is E181 here
  # rather than the quiet start of a second train nobody notices until two
  # versions are in flight. `stable` is always accepted.
  allowedChannels: [rc]

# There is no `initials` block on purpose: the baseline stays 0.0.0, and the
# first release is cut by a breaking change on the rc channel, which lands
# 1.0.0-rc.0. The directive comes before the `!` — `feat(crier)%rc!:` — because
# the header grammar puts `!` last; the other order is a parse error and would
# release on stable. See docs/operations/release.md.
#
# `commitErrors: error` refuses a release over a commit dispat cannot parse,
# rather than letting it contribute nothing in silence. It only became
# possible once the first tag existed: the seven commits that predate this
# repository's conventional-commit convention sat inside every window until
# v1.0.0-rc.0, and outside every window since.
commitErrors: error
#
# Every commit is scoped — feat(crier): …, fix(crier): … — because the scope is
# what attributes a change under internal/ to the package whose path is
# cmd/crier. A scopeless commit would be attributed by changed files, and only
# files under cmd/crier would count.

packages:
  crier:
    # A package path is a folder, never the repository root. Scripts run with
    # this as their working directory, which is why the ones that need the root
    # ask git for it rather than assuming.
    path: cmd/crier
    flow:
      build: build
      publish: [changelog, commit, github]
      announce: announce

changelog:
  enabled: true
  # Every channel, which is the default and is written down because it is a
  # decision: a release candidate earns a changelog entry like any other
  # release. Each entry documents only its own changeset, and the graduation to
  # stable collects the whole train into the one entry stable readers see.
  authors:
    placement: both
    exclude: ["*[bot]"]
  commitRefs:
    placement: suffix
    link: auto

commit:
  enabled: true
  push: true
  name: github-actions[bot]
  email: github-actions[bot]@users.noreply.github.com

github:
  enabled: true
  # Every channel too. dispat flags a GitHub release as a prerelease whenever
  # the version is one, so a v1.0.0-rc.0 release is marked as such without
  # being asked — which is what keeps `dispat install` and the install scripts
  # from resolving to it unless they are told to.
  #
  # The release body carries the same attribution the changelog does: who wrote
  # each change, and the short linked sha of the commit that carries it.
  authors:
    placement: both
    exclude: ["*[bot]"]
  commitRefs:
    placement: suffix
    link: auto
  dependencyLink: auto
  footer: |

    ## Install

    ```sh
    curl -fsSL https://raw.githubusercontent.com/yohimik/crier/v${DISPAT_NEW_VERSION}/install.sh | CRIER_VERSION=${DISPAT_NEW_VERSION} sh
    ```

    ```powershell
    $env:CRIER_VERSION = '${DISPAT_NEW_VERSION}'
    irm https://raw.githubusercontent.com/yohimik/crier/v${DISPAT_NEW_VERSION}/install.ps1 | iex
    ```

    ```sh
    dispat install yohimik/crier
    ```

scripts:
  # --- release steps --------------------------------------------------------
  changelog: dispat changelog
  commit: dispat commit --tag --push
  github: dispat github
  build: sh build.sh
  # What the workflow's later jobs need to know about the release that just
  # happened, in GitHub's own output format. Harmless outside Actions: the
  # fallback swallows it.
  # The outputs first, so the workflow's later jobs learn about the release
  # whatever the announcement does; then crier announces its own release with
  # the binary this run just built. The announce stage only warns, and
  # announce.sh exits 0 for every reason not to post, so neither can turn a
  # good release red.
  announce: |
    echo "released=true" >> "${GITHUB_OUTPUT:-/dev/null}"
    echo "version=$DISPAT_NEW_VERSION" >> "${GITHUB_OUTPUT:-/dev/null}"
    sh "$(git rev-parse --show-toplevel)/announce/announce.sh"

  # --- the gates ------------------------------------------------------------
  #
  # Each one is a target of the root Dockerfile, built with the repository as
  # the context. Scripts run in cmd/crier, so the context is read from git
  # rather than assumed. --output type=cacheonly because the log is the whole
  # product: a gate produces a verdict, not a file.
  gofmt: >-
    docker buildx build --file "$(git rev-parse --show-toplevel)/Dockerfile"
    --target gofmt --output type=cacheonly "$(git rev-parse --show-toplevel)"

  vet: >-
    docker buildx build --file "$(git rev-parse --show-toplevel)/Dockerfile"
    --target vet --output type=cacheonly "$(git rev-parse --show-toplevel)"

  lint: >-
    docker buildx build --file "$(git rev-parse --show-toplevel)/Dockerfile"
    --target golangci-lint --output type=cacheonly "$(git rev-parse --show-toplevel)"

  # The workflows, their expressions and the shell inside their run blocks.
  actionlint: >-
    docker buildx build --file "$(git rev-parse --show-toplevel)/Dockerfile"
    --target actionlint --output type=cacheonly "$(git rev-parse --show-toplevel)"

  # The install scripts and the release announcement.
  shellcheck: >-
    docker buildx build --file "$(git rev-parse --show-toplevel)/Dockerfile"
    --target shellcheck --output type=cacheonly "$(git rev-parse --show-toplevel)"

  # The generated documentation and the sample config, regenerated and
  # compared: a key added without either is a failing gate rather than a later
  # surprise.
  docs: >-
    docker buildx build --file "$(git rev-parse --show-toplevel)/Dockerfile"
    --target docs --output type=cacheonly "$(git rev-parse --show-toplevel)"

  # The unit suite, the black-box suite, the real-ffmpeg smoke and the coverage
  # floor, all in the test target — and the same target the release's export
  # descends from, so a release cannot carry binaries this did not pass.
  tests: >-
    docker buildx build --file "$(git rev-parse --show-toplevel)/Dockerfile"
    --target test --output type=cacheonly "$(git rev-parse --show-toplevel)"

  # The same suite, with the merged coverage profile exported for a caller that
  # wants the numbers.
  coverage: >-
    docker buildx build --file "$(git rev-parse --show-toplevel)/Dockerfile"
    --target coverage-export
    --output "type=local,dest=$(git rev-parse --show-toplevel)/coverage"
    "$(git rev-parse --show-toplevel)"

  # Every target the release builds, plus the validation each binary gets: a
  # change that only breaks the Windows build fails here rather than during a
  # release.
  cross-compile: >-
    docker buildx build --file "$(git rev-parse --show-toplevel)/Dockerfile"
    --target build --output type=cacheonly "$(git rev-parse --show-toplevel)"

  # The TinyGo spike, as a build like every other gate. Its targets never
  # abort: the logs are what it produces, so the export lands them in
  # coverage/tinygo-spike/ whatever they say, and the verdict is read from the
  # files rather than from a build's exit code.
  #
  # Not a gate, and not in any sweep: nothing a release ships is built with
  # TinyGo. Upstream cannot build crier at all, and the fork that speaks real
  # TLS links a crier that panics on its first template, because TinyGo's
  # reflect has no function introspection. The spike is what to re-run when
  # that changes: it installs the fork through scripts/install-tools.sh, builds
  # crier with it, and runs the self-update matrix over real TLS and the whole
  # black-box suite against the result. See the header of Dockerfile.tinygo and
  # docs/operations/tinygo.md.
  #
  # The token rides in as a build secret, and only when there is one: the
  # fork's install is one GitHub API call, which meets the unauthenticated rate
  # limit on a runner sharing its IP. The ${VAR:+...} form passes no flag at
  # all without a token, where an empty env=GITHUB_TOKEN would fail the build
  # for want of a variable.
  tinygo-spike: >-
    docker buildx build --file "$(git rev-parse --show-toplevel)/Dockerfile.tinygo"
    --target tinygo-spike-export
    ${GITHUB_TOKEN:+--secret id=GITHUB_TOKEN,env=GITHUB_TOKEN}
    --output "type=local,dest=$(git rev-parse --show-toplevel)/coverage/tinygo-spike"
    "$(git rev-parse --show-toplevel)"
